<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seat-layout-v4</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        background: #ffffff;
      }

      #seat-canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      #seat-selection-panel-root {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        width: min(280px, calc(100vw - 24px));
        pointer-events: none;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #111827;
      }

      #seat-selection-panel {
        box-sizing: border-box;
        max-height: calc(100vh - 24px);
        overflow: hidden;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        pointer-events: auto;
      }

      #seat-selection-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
        font-weight: 600;
      }

      #seat-selection-clear {
        border: 1px solid #9ca3af;
        border-radius: 6px;
        background: #ffffff;
        color: #111827;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        padding: 4px 8px;
      }

      #seat-selection-clear:disabled {
        cursor: default;
        opacity: 0.5;
      }

      #seat-selection-list {
        box-sizing: border-box;
        max-height: min(320px, calc(100vh - 88px));
        margin: 0;
        overflow: auto;
        padding: 8px 12px 10px 28px;
        font-size: 12px;
        line-height: 1.45;
      }

      #seat-selection-list:empty {
        padding: 0;
      }

      #seat-selection-list li {
        margin: 3px 0;
      }
    </style>
  </head>
  <body>
    <canvas id="seat-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
